<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root,
    change the href value below to reflect the base path you are
    serving from.

    The path provided below has to start and end with a slash "/".
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">

  <!-- Browser compatibility -->
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!--
    Responsive mobile viewport.

    IMPORTANT:
    Do NOT add:
      maximum-scale=1.0
      user-scalable=no

    Those settings can prevent normal browser zoom/pinch zoom.
  -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <!-- Website description -->
  <meta
    name="description"
    content="RIT Hostel - Hostel Information and Management Website"
  >

  <!-- iOS / Mobile Web App -->
  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="RIT Hostel"
  >

  <!-- iOS App Icon -->
  <link
    rel="apple-touch-icon"
    href="icons/Icon-192.png"
  >

  <!-- Favicon -->
  <link
    rel="icon"
    type="image/png"
    href="favicon.png"
  >

  <!-- Website title -->
  <title>RIT Hostel</title>

  <!-- Web App Manifest -->
  <link
    rel="manifest"
    href="manifest.json"
  >
</head>

<body>
  <!-- Flutter Web -->
  <script
    src="flutter_bootstrap.js"
    async
  ></script>
</body>
</html>
